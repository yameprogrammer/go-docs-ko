name: Sync Go docs to Korean

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */14 * *'  # every 2 weeks

concurrency:
  group: sync-go-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-go-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write

    env:
      TRANSLATION_PROVIDER: ${{ secrets.TRANSLATION_PROVIDER || 'ollama' }}
      SOURCE_REPO: ${{ secrets.SOURCE_REPO || 'https://github.com/golang/go.git' }}
      SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH || 'master' }}
      WEBSITE_SOURCE_REPO: ${{ secrets.WEBSITE_SOURCE_REPO || 'https://github.com/golang/website.git' }}
      WEBSITE_SOURCE_BRANCH: ${{ secrets.WEBSITE_SOURCE_BRANCH || 'master' }}
      OUTPUT_DIR: ${{ secrets.OUTPUT_DIR || 'docs/ko' }}
      TRANSLATE_STD_SYNOPSIS: ${{ secrets.TRANSLATE_STD_SYNOPSIS || 'true' }}
      INCLUDE_STD_GO_DOC_ALL: ${{ secrets.INCLUDE_STD_GO_DOC_ALL || 'true' }}

      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL || 'http://127.0.0.1:11434' }}
      OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'llama3.1' }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_MODEL: ${{ secrets.OPENAI_API_MODEL || 'gpt-4o-mini' }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if upstream Go docs changed
        id: upstream_check
        shell: bash
        run: |
          set -euo pipefail

          latest_go_sha=$(git ls-remote "$SOURCE_REPO" "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')
          latest_website_sha=$(git ls-remote "$WEBSITE_SOURCE_REPO" "refs/heads/$WEBSITE_SOURCE_BRANCH" | awk '{print $1}')
          current_go_sha=""
          current_website_sha=""

          if [ -f .upstream-go-sha ]; then
            current_go_sha=$(cat .upstream-go-sha)
          fi

          if [ -f .upstream-website-sha ]; then
            current_website_sha=$(cat .upstream-website-sha)
          fi

          if [ -z "$latest_go_sha" ] || [ -z "$latest_website_sha" ]; then
            echo "Failed to resolve upstream branch HEAD." >&2
            exit 1
          fi

          echo "latest_go_sha=$latest_go_sha"
          echo "current_go_sha=$current_go_sha"
          echo "latest_website_sha=$latest_website_sha"
          echo "current_website_sha=$current_website_sha"

          if [ "$latest_go_sha" = "$current_go_sha" ] && [ "$latest_website_sha" = "$current_website_sha" ]; then
            echo "No upstream changes detected. Skipping sync."
            echo "UPSTREAM_CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream changes detected."
            echo "UPSTREAM_CHANGED=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Set up Go
        if: steps.upstream_check.outputs.UPSTREAM_CHANGED == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Sync and translate Go docs
        if: steps.upstream_check.outputs.UPSTREAM_CHANGED == 'true'
        run: |
          set -euo pipefail

          python scripts/translate_docs.py \
            --source-repo "$SOURCE_REPO" \
            --source-branch "$SOURCE_BRANCH" \
            --output-dir "$OUTPUT_DIR"

          python scripts/sync_go_dev_doc.py \
            --source-repo "$WEBSITE_SOURCE_REPO" \
            --source-branch "$WEBSITE_SOURCE_BRANCH" \
            --output-dir "$OUTPUT_DIR/go-dev-doc" \
            --translate

          std_flags=()
          if [ "$TRANSLATE_STD_SYNOPSIS" = "true" ]; then
            std_flags+=(--translate-synopsis)
          fi
          if [ "$INCLUDE_STD_GO_DOC_ALL" = "true" ]; then
            std_flags+=(--include-go-doc-all)
          fi

          python scripts/generate_std_docs.py \
            --output-dir "$OUTPUT_DIR/pkg/std" \
            "${std_flags[@]}"

          latest_go_sha=$(git ls-remote "$SOURCE_REPO" "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')
          latest_website_sha=$(git ls-remote "$WEBSITE_SOURCE_REPO" "refs/heads/$WEBSITE_SOURCE_BRANCH" | awk '{print $1}')
          echo "$latest_go_sha" > .upstream-go-sha
          echo "$latest_website_sha" > .upstream-website-sha

      - name: Check whether generated content changed
        if: steps.upstream_check.outputs.UPSTREAM_CHANGED == 'true'
        id: generated_diff
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- . ':(exclude).upstream-go-sha' ':(exclude).upstream-website-sha'; then
            echo "No generated file changes found. Skipping PR creation."
            echo "HAS_GENERATED_CHANGES=false" >> "$GITHUB_OUTPUT"
          else
            echo "Generated file changes found."
            echo "HAS_GENERATED_CHANGES=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: >
          steps.upstream_check.outputs.UPSTREAM_CHANGED == 'true' &&
          steps.generated_diff.outputs.HAS_GENERATED_CHANGES == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'docs: sync Go official docs to Korean'
          title: 'docs: sync Go official docs to Korean'
          body: |
            This pull request is generated automatically from the Go official documentation repository.

            Important:
            - This is an unofficial, AI-assisted Korean translation mirror.
            - The original source remains authoritative.
            - Please verify translated content before merging.

            Source repository: `${{ env.SOURCE_REPO }}`
            Source branch: `${{ env.SOURCE_BRANCH }}`
            Translation backend: `${{ env.TRANSLATION_PROVIDER }}`
          branch: docs/sync-go-ko
          delete-branch: true
          labels: documentation, automation
