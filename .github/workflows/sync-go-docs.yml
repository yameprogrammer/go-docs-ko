name: Sync Go docs to Korean

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync-go-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER || 'ollama' }}
      SOURCE_REPO: ${{ vars.SOURCE_REPO || 'https://github.com/golang/go.git' }}
      SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH || 'master' }}
      OUTPUT_DIR: ${{ vars.OUTPUT_DIR || 'docs/ko' }}

      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://127.0.0.1:11434' }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.1' }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_MODEL: ${{ vars.OPENAI_API_MODEL || 'gpt-4o-mini' }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Sync and translate Go docs
        run: |
          python scripts/translate_docs.py \
            --source-repo "$SOURCE_REPO" \
            --source-branch "$SOURCE_BRANCH" \
            --output-dir "$OUTPUT_DIR"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'docs: sync Go official docs to Korean'
          title: 'docs: sync Go official docs to Korean'
          body: |
            This pull request is generated automatically from the Go official documentation repository.

            Important:
            - This is an unofficial, AI-assisted Korean translation mirror.
            - The original source remains authoritative.
            - Please verify translated content before merging.

            Source repository: `${{ env.SOURCE_REPO }}`
            Source branch: `${{ env.SOURCE_BRANCH }}`
            Translation backend: `${{ env.TRANSLATION_PROVIDER }}`
          branch: docs/sync-go-ko
          delete-branch: true
          labels: documentation, automation
